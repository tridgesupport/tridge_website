<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  .badge {
    width: 1200px;
    height: 1200px;
    background: #2F9E63;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  .badge .icon {
    width: 340px;
    color: #ffffff;
    margin-bottom: 18px;
  }
  .badge .word {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 148px;
    color: #ffffff;
    letter-spacing: -0.01em;
    line-height: 1;
    margin: 0 0 28px;
  }
  .badge .tag {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 40px;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="badge">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" fill="none">
      <path d="M10,78 A50,50 0 0 1 110,78 L98,78 A38,38 0 0 0 22,78 Z" fill="currentColor" opacity="0.32"/>
      <path d="M12,74 A44,44 0 0 1 100,74 L86,74 A30,30 0 0 0 26,74 Z" fill="currentColor"/>
    </svg>
    <div class="word">tridge</div>
    <div class="tag">Bridging Tech and Entrepreneurship</div>
  </div>
</body>
</html>
